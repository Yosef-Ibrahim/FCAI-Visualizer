name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository — no write permissions needed.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node (from .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (scoped checkJs on the i18n layer)
        run: npm run typecheck

      - name: i18n consistency check
        run: npm run i18n:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
