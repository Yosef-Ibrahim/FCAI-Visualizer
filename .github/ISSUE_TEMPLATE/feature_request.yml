name: Feature request
description: Suggest a new feature, visualization, or learning improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Tell us what would make learning algorithms and data structures clearer or more useful."
  - type: input
    id: area
    attributes:
      label: Related topic
      placeholder: "e.g. Linked Lists, Graphs, Practice"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your suggestion
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Examples or references
