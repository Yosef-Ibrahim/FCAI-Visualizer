<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180" role="img" aria-label="Team: Kareem Ahmed" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="10" y="10" width="580" height="160" rx="22"/></clipPath>
    <style>
      .name { font-family:'Segoe UI',Arial,sans-serif; font-weight:800; font-size:46px; fill:#f8fafc; }
      .init { font-family:'Segoe UI',Arial,sans-serif; font-weight:800; font-size:38px; fill:#ffffff; text-anchor:middle; }
    </style>
  </defs>

  <!-- card -->
  <rect x="10" y="10" width="580" height="160" rx="22" fill="url(#bg)"/>
  <rect x="10" y="10" width="580" height="160" rx="22" fill="none" stroke="url(#accent)" stroke-width="3">
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- avatar -->
  <circle cx="110" cy="90" r="44" fill="url(#accent)"/>
  <text class="init" x="110" y="103">KA</text>

  <!-- name -->
  <text class="name" x="180" y="106">Kareem Ahmed</text>

  <!-- moving shine -->
  <g clip-path="url(#card)">
    <rect x="-200" y="-10" width="150" height="220" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-200;700" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
