<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="B-Tree banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .node { fill:#1e293b; stroke:url(#accent); stroke-width:2; }
      .root { fill:#312e81; stroke:#a78bfa; stroke-width:2.5; }
      .leaf { fill:#0f172a; stroke:#38bdf8; stroke-width:2; }
      .edge { stroke:#64748b; stroke-width:2; fill:none; }
      .k { font-family:Consolas,'Courier New',monospace; font-size:17px; fill:#e2e8f0; text-anchor:middle; }
      .title { font-family:'Segoe UI',Arial,sans-serif; font-weight:800; font-size:78px; fill:url(#accent); }
      .sub { font-family:'Segoe UI',Arial,sans-serif; font-size:24px; fill:#e2e8f0; letter-spacing:2px; }
      .small { font-family:'Segoe UI',Arial,sans-serif; font-size:17px; fill:#94a3b8; }
      .pop { opacity:0; animation:pop 0.7s ease-out forwards; }
      .d1 { animation-delay:0.2s; } .d2 { animation-delay:0.7s; } .d3 { animation-delay:1.2s; }
      @keyframes pop { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- text -->
  <text x="60" y="140" class="title">B-Tree</text>
  <text x="64" y="190" class="sub">INSERT · DELETE · SPLIT · MERGE</text>
  <text x="64" y="232" class="small">Template-based C++ implementation</text>
  <text x="64" y="258" class="small">Node / InternalNode / LeafNode (inheritance)</text>

  <!-- edges -->
  <g class="edge">
    <path d="M900 78 L790 130"/><path d="M900 78 L1010 130"/>
    <path d="M790 166 L725 210"/><path d="M790 166 L855 210"/>
    <path d="M1010 166 L945 210"/><path d="M1010 166 L1075 210"/>
  </g>

  <!-- root -->
  <g class="pop d1">
    <rect class="root" x="868" y="42" width="64" height="36" rx="8"/>
    <text class="k" x="900" y="66">K</text>
  </g>

  <!-- level 2 -->
  <g class="pop d2">
    <rect class="node" x="745" y="130" width="90" height="36" rx="8"/>
    <text class="k" x="790" y="154">C | G</text>
    <rect class="node" x="965" y="130" width="90" height="36" rx="8"/>
    <text class="k" x="1010" y="154">N | R</text>
  </g>

  <!-- leaves -->
  <g class="pop d3">
    <rect class="leaf" x="685" y="210" width="80" height="36" rx="8"/><text class="k" x="725" y="234">A B</text>
    <rect class="leaf" x="815" y="210" width="80" height="36" rx="8"/><text class="k" x="855" y="234">D E F</text>
    <rect class="leaf" x="905" y="210" width="80" height="36" rx="8"/><text class="k" x="945" y="234">L M</text>
    <rect class="leaf" x="1035" y="210" width="80" height="36" rx="8"/><text class="k" x="1075" y="234">P Q</text>
  </g>
</svg>
